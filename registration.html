<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Registration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="ACSS/registration.css">
</head>
<body>
    <div class="register-wrapper">
        <section class="icon-section">
            <p>Create your tenant account</p>
            <i class="bi bi-person-circle"></i>
        </section>
        
        <section class="registrationcontainer">
            <!-- Static error message example -->
            <div class="error-message" style="display: none;">
                Email already registered!
            </div>
            
            <form method="POST" action="#">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Input your username" required
                           value="Demo User">
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Input your email" required
                           value="demo@example.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Input your password (min. 6 characters)" required
                           value="demo123">
                </div>

                <div class="input-group">
                    <label for="invitecode">Invitation Code</label>
                    <input id="invitecode" name="invitecode" type="text" placeholder="Input your invitation code" required
                           value="INVITE123">
                </div>
                
                <button type="submit" class="submitbtn">Register</button>
                
                <p class="login">
                    Already have an account? <a href="index.html">Login</a>
                </p>
            </form>
        </section>
    </div>
</body>
</html>
