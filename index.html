<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="ACSS/login.css">

</head>
<body>
    <div class="login-wrapper">
        <section class="icon-section">
            <p>Login to continue</p>
            <i class="bi bi-person-circle"></i>
        </section>
        
        <section class="logincontainer">
            <!-- Demo success message (static) -->
            <div class="success-message" style="display: none;">
                Registration successful! Please login.
            </div>
            
            <div class="error-message" style="display: none;">
                Invalid email or password!
            </div>
            
            <form id="loginForm" method="POST" action="#">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Input your email" required 
                           value="demo@example.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Input your password" required 
                           value="demo123">
                </div>
                <button type="submit" class="submitbtn">Log in</button>
                
                <p class="register">
                    Don't have an account? <a href="registration.html">Register</a>
                </p>
            </form>
            
        </section>
        
    </div>
    <div class="demo-buttons-container">
        <p class="demo-label">Quick Demo Access:</p>
        <div class="demo-buttons">
            <a class="demobut manager-demo" href="MANAGER/managerdashboard.html">
                <i class="bi bi-person-badge"></i> Log in as Manager
            </a>
            <a class="demobut tenant-demo" href="TENANT/dashboard.html">
                <i class="bi bi-person"></i> Log in as Tenant
            </a>
        </div>
    </div>
</body>
</html>
