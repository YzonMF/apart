<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Room - Tenant Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
  <link rel="stylesheet" href="CSS/membership.css">
</head>

<body>
<div class="app">
  <input type="checkbox" id="menu-toggle">

  <div class="sidebar">
    <label for="menu-toggle" class="menu-btn">
      <i class="fa-solid fa-bars"></i>
    </label>

    <div class="menu-items">
      <a href="dashboard.html" class="icon-btn" title="Dashboard">
        <i class="fa-solid fa-house"></i>
      </a>
      <a href="membership.html" class="icon-btn active" title="My Room">
        <i class="fa-solid fa-id-card"></i>
      </a>
      <a href="payments.html" class="icon-btn" title="Payments">
        <i class="fa-solid fa-credit-card"></i>
      </a>

      <a href="notifications.html" class="icon-btn" title="Notifications">
        <i class="fa-solid fa-bell"></i>
      </a>
      <a href="profile.html" class="icon-btn" title="Profile">
        <i class="fa-solid fa-user"></i>
      </a>
      <a href="../index.html" class="icon-btn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
    </div>
  </div>

  <div class="content tenant-content">
    <div class="container">
      <div class="header">
        <h1><i class="bi bi-house-door-fill"></i> My Room Details</h1>
        <p>Complete membership and room information</p>
      </div>

      <div class="info-section">
        <h2><i class="bi bi-person-badge"></i> Membership Information</h2>
        <div class="info-grid">
          <div class="info-item"><label>Membership ID</label><span>TEN-2024-001</span></div>
          <div class="info-item"><label>Status</label><span class="status active">Active</span></div>
          <div class="info-item"><label>Date Joined</label><span>January 1, 2024</span></div>
          <div class="info-item"><label>Invitation Code</label><span>BLD-A-305</span></div>
        </div>
      </div>

      <div class="info-section">
        <h2><i class="bi bi-door-closed"></i> Room Specifications</h2>
        <div class="info-grid">
          <div class="info-item"><label>Building</label><span>Building A</span></div>
          <div class="info-item"><label>Room Number</label><span>305</span></div>
          <div class="info-item"><label>Room Type</label><span>1 Bedroom Unit</span></div>
          <div class="info-item"><label>Floor Area</label><span>35 sqm</span></div>
        </div>
      </div>

      <div class="info-section">
        <h2><i class="bi bi-star"></i> Included Amenities</h2>
        <div class="info-grid">
          <div class="info-item"><label>WiFi Internet</label><span>Included</span></div>
          <div class="info-item"><label>Water Heater</label><span>Provided</span></div>
          <div class="info-item"><label>Air Conditioning</label><span>Installed</span></div>
          <div class="info-item"><label>24/7 Security</label><span>Yes</span></div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
