<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="ACSS/registration.css">
</head>
<body>
    <div class="register-wrapper">
        <section class="icon-section">
            <p>Forgot Password</p>
        </section>
        
        <section class="registrationcontainer">
            <div class="error-message" style="display: none;">
                Email doesn't exist!
            </div>
            <form method="POST" action="#">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="Input your email" required
                           value="demo@example.com">
                </div>
                
                <button type="submit" class="submitbtn"><a href="forgotpass.html" class="sendotpbtn">Send OTP to Email</a></button>
            </form>

            <form method="POST" action="#">
                <div class="input-group">
                    <label for="otp">OTP</label>
                    <input id="otp" name="otp" type="otp" placeholder="Input received OTP Code" required
                           value="123ABC">
                </div>
                
                <button type="submit" class="submitbtn"><a href="resetpass.html">Submit OTP</a></button>
                
                <p class="login">
                    <a href="index.html">Back to Login</a>
                </p>
            </form>
        </section>
    </div>

    <script>
    document.querySelector('.sendotpbtn').addEventListener('click', function () {
        if (confirm('OTP has been sent!')) {
            window.location.href = "file:///D:/XAMPP-HTDOCS/APARTMENT/index.html";
        }
    });
    </script>
</body>
</html>
