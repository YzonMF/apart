<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="ACSS/registration.css">
    <style>
        .btn-change {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            width: 100%;
            text-align: center;
        }
        .btn-change:hover {
            background: rgba(245,180,0,.8);
        }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <section class="icon-section">
            <p>Set New Password</p>
            <i class="bi bi-key"></i>
        </section>
        
        <section class="registrationcontainer">
            <form method="POST" action="#">
                <div class="input-group">
                    <label for="password">New Password</label>
                    <input id="password" name="password" type="password" placeholder="Min. 6 characters" required>
                </div>
                <div class="input-group">
                    <label for="confirm">Confirm Password</label>
                    <input id="confirm" name="confirm" type="password" placeholder="Re-enter new password" required>
                </div>
                <button type="submit" class="btn-change"><i class="bi bi-check-lg"></i> Change Password</button>
            </form>
            <p style="text-align:center; margin-top:15px;"><a href="index.html" style="color:var(--accent);">Back to Login</a></p>
        </section>
    </div>
</body>
</html>
