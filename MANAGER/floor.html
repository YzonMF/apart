<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="MCSS/floor.css">
    <link rel="stylesheet" href="MCSS/sidebar.css">
    <title>Floor Management</title>
</head>
<body>
    <div class="app">
        <input type="checkbox" id="menu-toggle">

    <aside class="sidebar">
      <div class="menu-items">
        <a href="managerdashboard.html" class="icon-btn active" title="Dashboard">
          <i class="fa-solid fa-chart-line"></i>
        </a>
        <a href="profile.html" class="icon-btn" title="Profile">
          <i class="fa-solid fa-user-circle"></i>
        </a>
        <a href="floor.html" class="icon-btn" title="Properties">
          <i class="fa-solid fa-building"></i>
        </a>
        <a href="payments.html" class="icon-btn" title="Payments">
          <i class="fa-solid fa-credit-card"></i>
        </a>
        <a href="notifications.html" class="icon-btn" title="Notifications">
          <i class="fa-solid fa-bell"></i>
        </a>
        <a href="reports.html" class="icon-btn" title="Reports">
          <i class="fa-solid fa-chart-bar"></i>
        </a>
        <a href="tenants.html" class="icon-btn" title="Tenants">
          <i class="fa-solid fa-users"></i>
        </a>
        <a href="settings.html" class="icon-btn" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </a>
        <a href="../index.html" class="icon-btn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
      </div>
    </aside>

        <div class="content">
            <div class="floor-container">
                <div class="floor-header">
                    <h1><i class="fa-solid fa-building"></i> Floor Management</h1>
                </div>

                <div class="building-section">
                    <div class="form-group">
                        <label for="building-select">
                            <i class="fa-solid fa-city"></i> Select Building
                        </label>
                        <select id="building-select" class="form-select">
                            <option value="building-a">Building A - Main Tower</option>
                            <option value="building-b">Building B - Annex</option>
                            <option value="building-c">Building C - Garden Wing</option>
                        </select>
                    </div>
                </div>

                <div class="floor-navigation">
                    <div class="floor-nav-header">
                        <h2><i class="fa-solid fa-layer-group"></i> Floors</h2>
                        <button class="btn-add-floor">
                            <i class="fa-solid fa-plus"></i> Add Floor
                        </button>
                    </div>
                    
                    <div class="floor-list">
                        <div class="floor-item active" data-floor="ground">
                            <i class="fa-solid fa-door-open"></i>
                            <span>Ground Floor</span>
                            <span class="unit-count">12 Units</span>
                        </div>
                        <div class="floor-item" data-floor="first">
                            <i class="fa-solid fa-door-closed"></i>
                            <span>1st Floor</span>
                            <span class="unit-count">10 Units</span>
                        </div>
                        <div class="floor-item" data-floor="second">
                            <i class="fa-solid fa-door-closed"></i>
                            <span>2nd Floor</span>
                            <span class="unit-count">10 Units</span>
                        </div>
                        <div class="floor-item" data-floor="third">
                            <i class="fa-solid fa-door-closed"></i>
                            <span>3rd Floor</span>
                            <span class="unit-count">8 Units</span>
                        </div>
                    </div>
                </div>

                <div class="floor-details">
                    <div class="details-header">
                        <h3><i class="fa-solid fa-map"></i> Floor Layout - <span id="current-floor">Ground Floor</span></h3>
                        <button class="btn-edit">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                    </div>

                    <div class="floor-info">
                        <div class="info-grid">
                            <div class="info-item">
                                <label><i class="fa-solid fa-hashtag"></i> Floor Number</label>
                                <span>G/F</span>
                            </div>
                            <div class="info-item">
                                <label><i class="fa-solid fa-door-open"></i> Total Units</label>
                                <span>12 Units</span>
                            </div>
                            <div class="info-item">
                                <label><i class="fa-solid fa-user-check"></i> Occupied</label>
                                <span>8 Units</span>
                            </div>
                            <div class="info-item">
                                <label><i class="fa-solid fa-user-slash"></i> Vacant</label>
                                <span>4 Units</span>
                            </div>
                        </div>
                    </div>

                    <div class="unit-grid-section">
                        <h4><i class="fa-solid fa-th-large"></i> Unit Layout</h4>
                        <div class="unit-grid">
                          
                        </div>
                    </div>

                    <div class="floor-stats">
                        <h4><i class="fa-solid fa-chart-bar"></i> Statistics</h4>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <div class="stat-icon occupancy">
                                    <i class="fa-solid fa-percentage"></i>
                                </div>
                                <div class="stat-info">
                                    <h5>Occupancy Rate</h5>
                                    <span class="stat-value">66.7%</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon revenue">
                                    <i class="fa-solid fa-money-bill-wave"></i>
                                </div>
                                <div class="stat-info">
                                    <h5>Monthly Revenue</h5>
                                    <span class="stat-value">₱120,000</span>
                                </div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-icon maintenance">
                                    <i class="fa-solid fa-tools"></i>
                                </div>
                                <div class="stat-info">
                                    <h5>Active Requests</h5>
                                    <span class="stat-value">3</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-save">
                        <i class="fa-solid fa-floppy-disk"></i> Save Changes
                    </button>
                    <button class="btn-print">
                        <i class="fa-solid fa-print"></i> Print Report
                    </button>
                    <button class="btn-refresh" onclick="loadFloorData()">
                        <i class="fa-solid fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="JS/floor.js"></script>
</body>
</html>
