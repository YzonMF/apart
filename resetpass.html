<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="ACSS/registration.css">
</head>
<body>
    <div class="register-wrapper">
        <section class="icon-section">
            <p>Reset Password</p>
            <i class="bi bi-person-circle"></i>
        </section>
        
        <section class="registrationcontainer">
            
            <form method="POST" action="#">
                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Input your password (min. 6 characters)" required
                           value="demo123">
                </div>

                <div class="input-group">
                    <label for="password">Re-enter Password</label>
                    <input id="password" name="password" type="password" placeholder="Input your password (min. 6 characters)" required
                           value="demo123">
                </div>
                
                <button type="submit" class="submitbtn"><a href="index.html">Change Password</a></button>
            </form>
        </section>
    </div>
</body>
</html>
