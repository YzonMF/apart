<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="ACSS/registration.css">
    <link rel="stylesheet" href="ACSS/reset.css">
</head>
<body>
    <div class="register-wrapper">
        <section class="icon-section">
            <p>Reset Password</p>
            <i class="bi bi-person-circle"></i>
        </section>
        
        <section class="registrationcontainer">
            <form method="POST" action="#">
                <!-- Step 1: Request OTP -->
                <div class="otp-section">
                    <h4><i class="bi bi-envelope"></i> 1. Request OTP</h4>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input id="email" name="email" type="email" placeholder="Enter your registered email" required>
                    </div>
                    <a href="#" class="btn-otp"><i class="bi bi-send"></i> Send OTP</a>
                </div>

                <div class="otp-section">
                    <h4><i class="bi bi-shield-lock"></i> 2. Verify Identity</h4>
                    <div class="input-group">
                        <label for="otp">Enter OTP</label>
                        <input id="otp" name="otp" type="text" placeholder="6-digit OTP">
                    </div>
                    <p><strong>OR</strong></p>
                    <div class="upload-section">
                        <label for="idUpload">Upload Government ID</label>
                        <input type="file" id="idUpload" class="file-input" accept=".jpg,.png,.pdf">
                    </div>
                </div>


                <a href="newpassword.html" class="btn-verify"><i class="bi bi-check-circle"></i> Verify & Proceed to Set Password</a>
            </form>
        </section>
    </div>
</body>
</html>
