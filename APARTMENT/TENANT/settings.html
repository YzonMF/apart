<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Tenant Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
  <link rel="stylesheet" href="CSS/settings.css">
</head>

<body>
<div class="app">
  <input type="checkbox" id="menu-toggle">

  <div class="sidebar">
    <label for="menu-toggle" class="menu-btn">
      <i class="fa-solid fa-bars"></i>
    </label>

    <div class="menu-items">
      <a href="dashboard.html" class="icon-btn" title="Dashboard">
        <i class="fa-solid fa-house"></i>
      </a>
      <a href="membership.html" class="icon-btn" title="My Room">
        <i class="fa-solid fa-id-card"></i>
      </a>
      <a href="payments.html" class="icon-btn" title="Payments">
        <i class="fa-solid fa-credit-card"></i>
      </a>
      <a href="maintenance.html" class="icon-btn" title="Maintenance">
        <i class="fa-solid fa-tools"></i>
      </a>
      <a href="notifications.html" class="icon-btn" title="Notifications">
        <i class="fa-solid fa-bell"></i>
      </a>
      <a href="profile.html" class="icon-btn" title="Profile">
        <i class="fa-solid fa-user"></i>
      </a>
      <a href="settings.html" class="icon-btn active" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </a>
      <a href="../index.html" class="icon-btn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </a>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content tenant-content">
    <div class="container">
      <div class="header">
        <h1><i class="bi bi-gear"></i> Account Settings</h1>
        <p>Customize your portal preferences</p>
      </div>

      <div class="info-section">
        <h2><i class="bi bi-person-gear"></i> Account Settings</h2>
        
        <div class="form-group">
          <label>Language Preference</label>
          <select style="width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 5px;">
            <option selected>English</option>
            <option>Filipino</option>
            <option>Spanish</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Time Zone</label>
          <select style="width: 100%; padding: 10px; border: 2px solid #eee; border-radius: 5px;">
            <option selected>Philippine Time (UTC+8)</option>
            <option>Pacific Time (UTC-8)</option>
          </select>
        </div>
        
        <a href="#" class="action-btn" style="display: block; text-align: center;">
          <i class="bi bi-check-circle"></i> Save Settings
        </a>
      </div>

      <div class="info-section">
        <h2><i class="bi bi-bell"></i> Notification Preferences</h2>
        
        <div class="setting-item">
          <span>Payment Notifications</span>
          <input type="checkbox" checked style="transform: scale(1.2);">
        </div>
        
        <div class="setting-item">
          <span>Maintenance Updates</span>
          <input type="checkbox" checked style="transform: scale(1.2);">
        </div>
        
        <div class="setting-item">
          <span>Building Announcements</span>
          <input type="checkbox" checked style="transform: scale(1.2);">
        </div>
        
        <div class="setting-item">
          <span>Email Notifications</span>
          <input type="checkbox" style="transform: scale(1.2);">
        </div>
      </div>

      <div class="info-section">
        <h2><i class="bi bi-shield-check"></i> Security</h2>
        
        <div class="security-item">
          <p><strong>Last Login:</strong> Today, 9:00 AM</p>
          <p><strong>Session:</strong> Windows Desktop • Chrome</p>
        </div>
        
        <div class="quick-actions">
          <a href="#" class="action-btn">
            <i class="bi bi-key"></i> Change Password
          </a>
        </div>
      </div>

    </div>
  </div>
</div>


</body>
</html>
